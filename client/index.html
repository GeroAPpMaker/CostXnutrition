<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CostPlate</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <style>
    .home-wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh; gap: 2rem; padding: 1.5rem;
    }
    .home-logo { font-size: 2.5rem; font-weight: 800; }
    .home-logo span { color: var(--clr-accent); }
    .home-tagline { color: var(--clr-muted); font-size: var(--fs-sm); text-align: center; }
    .home-cards { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 360px; }
    .home-divider { text-align: center; color: var(--clr-muted); font-size: var(--fs-sm); }
  </style>
</head>
<body>
  <div class="home-wrap">
    <div>
      <div class="home-logo">Cost<span>Plate</span></div>
      <p class="home-tagline">Food cost &amp; nutrition classroom app</p>
    </div>
    <div class="home-cards">
      <a href="/student.html" class="btn btn-primary btn-full">Join a session</a>
      <div class="home-divider">— or —</div>
      <a href="/facilitator.html" class="btn btn-outline btn-full">Facilitator dashboard</a>
      <a href="/projector.html" class="btn btn-outline btn-full">Projector view</a>
    </div>
  </div>
</body>
</html>
